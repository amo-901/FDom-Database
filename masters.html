<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/Domination Masters</title>
    <link rel="stylesheet" href="orbs.css">
    <link rel="stylesheet" href="masters.css">
    <link rel="icon" type="image/png" href="favicon32x32.png">
</head>
<body>
    <header>
        <div class="upper-taskbar">
            <a href="./">
                <img id="taskbar-logo" src="resources/taskbarlogo.png">
            </a>
            <div class="taskbar-buttons">
                <h1 class="nav-button">
                    <a href="servants.html">Servants</a>
                </h1>
                <h1 class="nav-button">
                    <a href="masters.html">Masters</a>
                </h1>
                <h1 class="nav-button">
                    <a href="search.html">Card Search</a>
                </h1>
                <h1 class="nav-button">
                    <a href="map.html">Map</a>
                </h1>
            </div>         
        </div>
    </header>
    <main>
        <div class="filter-board">
            <input type="text" id="sidebarSearch" class="sidebar-search" placeholder="Search master name...">
            <div class="sort-dropdown">
                <button id="sortToggle" class="filter-toggle-btn">Sort</button>
                <ul class="sort-menu hidden" id="sortMenu"></ul>
            </div>
            <button id="filterToggle" class="filter-toggle-btn">Filter</button>
            <label class="show-toggle-label"><input type="checkbox" id="showOfficial" checked> Official</label> <!-- ticked = show official (non-beta, non-custom) entries -->
            <label class="show-toggle-label"><input type="checkbox" id="showBeta"> Beta</label> <!-- ticked = show beta entries -->
            <label class="show-toggle-label"><input type="checkbox" id="showCustom"> Custom</label> <!-- ticked = show custom entries -->
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
    </main>
    <footer>
        
    </footer>

    <div class="filter-sidebar" id="filterSidebar">
        <button class="sidebar-close" id="sidebarClose">&times;</button>
        <div class="filter-content">         
            <div class="filter-group">
                <h3>Mechanics</h3>
                <div id="mechanicsFilterGroup"></div>
            </div>
        </div>

        <button id="resetFilters" class="reset-btn">Reset</button>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="master-modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-info">
                <div class="portrait-frame"> <!-- wrapper so the CUSTOM label can sit on top of the portrait -->
                    <img class="modal-portrait" id="modalPortrait" src="" alt="">
                    <span class="overlay-label modal-overlay-label"> <!-- CUSTOM / BETA text on top of the portrait -->
                        <span class="overlay-custom hidden" id="modalCustomText">CUSTOM</span>
                        <span class="overlay-beta hidden" id="modalBetaText">BETA</span>
                    </span>
                </div>
                    <div class="modal-text">
                        <div class="modal-master-title">
                            <h1 class="master-name" id="master-name">Master Name</h1>
                        </div>
                        <p class="modal-master-description" id="master-description"></p>
                    </div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p id="ability-heading">Master Abilities: </p>
                </div>
                <div class="ability-grid" id="modalAbilities"></div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p id="ascension-heading">Master Ascension: </p>
                </div>
                <div class="ascension-info">
                    <img class="ascension-portrait" id="modalAscension" src="" alt="">
                </div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p id="assets-heading">Master Assets: </p>
                </div>
                <div class="asset-grid" id="modalAssets"></div>
            </div>
        </div>
    </div>
    <div class="lightbox-overlay" id="imageLightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="">
    </div>
    <script src="orbs.js"></script>
    <script src="masters.js"></script>
</body>
</html>
