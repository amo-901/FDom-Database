<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/Domination Card Search</title>
    <link rel="stylesheet" href="orbs.css">
    <link rel="stylesheet" href="search.css">
    <link rel="icon" type="image/png" href="favicon32x32.png">
</head>
<body>
    <header>
        <div class="upper-taskbar">
            <a href="./">
                <img id="taskbar-logo" src="resources/taskbarlogo.png">
            </a>
            <div class="taskbar-buttons">
                <h1 class="nav-button">
                    <a href="servants.html">Servants</a>
                </h1>
                <h1 class="nav-button">
                    <a href="masters.html">Masters</a>
                </h1>
                <h1 class="nav-button">
                    <a href="search.html">Card Search</a>
                </h1>
                <h1 class="nav-button">
                    <a href="map.html">Map</a>
                </h1>
            </div>         
        </div>
    </header>
    <main>
        <!-- centred search bar -->
        <div class="search-board">
            <input type="text" id="cardSearch" class="card-search" placeholder="Enter a card name..." autocomplete="off">
        </div>
        <!-- matching cards are drawn in here by search.js -->
        <div class="cards-grid" id="cardsGrid"></div>
    </main>

    <!-- Enlarged card view -->
    <div class="lightbox-overlay" id="imageLightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="">
    </div>
    <script src="orbs.js"></script>
    <script src="search.js"></script>
</body>
</html>
